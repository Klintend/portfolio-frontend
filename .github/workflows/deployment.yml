name: Deploy Portfolio Frontend to Azure

on:
  push:
    branches:
      - dev


jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        # env:
        #   VITE_CLIENT_ID: ${{ secrets.VITE_CLIENT_ID }}
        #   VITE_TENANT_ID: ${{ secrets.VITE_TENANT_ID }}
        #   VITE_REDIRECTURI: ${{ secrets.VITE_REDIRECTURI }}
        #   VITE_GRAPHDATA: ${{ secrets.VITE_GRAPHDATA }}
        #   VITE_GRAPHIMAGE: ${{ secrets.VITE_GRAPHIMAGE }}
        #   VITE_ADMIN_BASE_URL: ${{ secrets.VITE_ADMIN_BASE_URL }}
        #   VITE_APP_BASEAPI_SCOPE: ${{ secrets.VITE_APP_BASEAPI_SCOPE }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
